# Optional macOS newsyslog rule for launchd stdout/stderr panic logs
# Install (optional): sudo cp ops/launchd/newsyslog-assistant-worker.conf /etc/newsyslog.d/assistant-worker.conf
# Primary structured worker.log already self-rotates at 2 MB x 3 backups in Node.
#
# logfilename                                          [owner:group]  mode  count  size(KB)  when  flags
/Users/Shared/assistant-worker/launchd-stdout.log      :staff         600   3      1024      *     NJ
/Users/Shared/assistant-worker/launchd-stderr.log      :staff         600   3      1024      *     NJ
