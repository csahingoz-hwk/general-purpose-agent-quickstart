name: Temporary SDK 7 lockfile regeneration
on:
  push:
    branches:
      - feature/ai-sdk7-migration
    paths:
      - package.json
      - .github/workflows/sdk7-lockgen.yml
permissions:
  contents: write
jobs:
  lockfile:
    if: github.repository == 'csahingoz-hwk/general-purpose-agent-quickstart'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out isolated migration branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
      - name: Use Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Install pinned pnpm
        run: npm install --global pnpm@10.32.1
      - name: Refresh only the pnpm lockfile
        run: pnpm install --lockfile-only --ignore-scripts --no-frozen-lockfile
      - name: Commit lockfile only, if changed
        run: |
          git add pnpm-lock.yaml
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: regenerate lockfile for AI SDK 7"
            git push origin HEAD:feature/ai-sdk7-migration
          fi
